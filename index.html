function lessonModal(id){const l=lessonAll().find(x=>x.id===id);if(!l)return;let isLocked=l.chapter>openChapter()&&!chapDone(l.chapter),done=!!s.completed[l.id];let hdr=`<div class="eyebrow">CHAPTER ${String(l.chapter).padStart(2,'0')} · ${l.category==='變美'?'BEAUTY':'INNER POWER'}</div><h2>${esc(l.title)}</h2><div class="knowledge">${esc(l.knowledge)}</div><div class="practice"><b>✧ 今日的實踐練習</b>${esc(l.challenge)}</div>`;if(done){modal(hdr+`<span class="chip success">✓ 已完成關卡</span><p class="muted" style="margin-top:13px">你已通過這項知識測驗及自我實踐，值得收藏在成長履歷裡。</p><button class="btn" data-act="close-modal">繼續旅程</button>`);return}if(isLocked){modal(hdr+`<div class="tip">你可以先閱讀知識；但要完成上一章全部 6 關，才能挑戰此關。</div><button class="btn secondary" style="margin-top:12px" data-act="close-modal">返回學院</button>`);return}
modal(hdr+`<div class="quiz"><h4>📖 小測驗｜${esc(l.question)}</h4>${l.options.map((op,i)=>`<label class="answer"><input type="radio" name="quiz-answer" value="${i}"><span>${String.fromCharCode(65+i)}. ${esc(op)}</span></label>`).join('')}</div><label class="checkline"><input type="checkbox" id="practice-check"> <span>我確實已完成上面的實踐練習（誠實自我確認）</span></label><div id="quiz-feedback" aria-live="polite"></div><button class="btn" data-act="submit-lesson" data-id="${esc(l.id)}">完成考驗・獲得成長點</button>`)}
function submitLesson(id){let l=lessonAll().find(x=>x.id===id),f=$('#quiz-feedback'),chosen=$('input[name="quiz-answer"]:checked');if(!l||!f)return;if(!chosen){f.innerHTML='<div class="feedback error">請先選一個答案。</div>';return}if(Number(chosen.value)!==l.answer){f.innerHTML=`<div class="feedback error">再試一次。提示：${esc(l.explanation)}</div>`;return}if(!$('#practice-check')?.checked){f.innerHTML='<div class="feedback error">答對了！請在實際完成練習後，再勾選實踐確認。</div>';return}if(l.chapter>openChapter()&&!chapDone(l.chapter)){toast('請先完成上一章');return}s.completed[id]={at:new Date().toISOString()};save();let chapterCompleted=chapDone(l.chapter);if(chapterCompleted&&!s.readStories[l.chapter]){render();storyModal(l.chapter);toast('🎉 章節通關！解鎖新的浪漫故事')}else{modal(`<span class="achievement-pop">🏅</span><h2 style="text-align:center">關卡通過！</h2><p style="text-align:center">${esc(l.title)} 已收藏。<br><b style="color:#ab7192">＋20 成長點</b></p><p class="tip">${esc(l.explanation)}</p><div class="btn-row" style="justify-content:center;margin-top:16px"><button class="btn" data-act="close-modal">繼續成長 ❯</button></div>`);render()}}
function storyModal(c){let st=BASE.stories.find(x=>x.chapter===c);if(!st||!chapDone(c)){toast('完成指定章節才能開啟劇情');return}s.readStories[c]=true;save();let end=c===8;modal(`<div class="scene-banner ${end?'marriage-scene':''}"><span>THE STORY · EPISODE ${c}</span></div><div class="eyebrow">${esc(st.label)} ✦</div><h2>${esc(st.title)}</h2><p class="muted">${esc(st.setting)}</p><div class="scene-body">${esc(st.body)}</div><div class="scene-quote">${esc(st.quote)}</div>${end?`${s.married?'<button class="btn" data-act="go-love">回到婚姻模式 ♡</button>':'<div class="btn-row"><button class="btn" data-act="accept-proposal">💍 我願意</button><button class="btn secondary" data-act="defer-proposal">讓我再想想</button></div>'}`:`<div class="btn-row"><button class="btn" data-act="next-chapter" data-id="${c}">收藏回憶・前往下一章 ❯</button><button class="btn secondary" data-act="finish-story">留在這一章</button></div>`}`,'wide')}
function invModal(marriedDate=false){if(stage()===0){toast('先完成第一章解鎖陸言');return}let date=today(),already=s.lastInvite===date;let oldInvite=s.messages.find(m=>m.type==='邀約'&&m.at?.slice(0,10)===date);let suggestions=marriedDate?lines.married:stage()>=4?lines.date:lines.early;let index=(Number(date.replaceAll('-',''))+s.hearts+(marriedDate?1:0))%suggestions.length;invite={text:already&&oldInvite?oldInvite.his:suggestions[index],marriedDate};modal(`<div class="eyebrow">💌 ${s.married?'HUSBAND CALLING':'A DATE WITH HIM'}</div><h2>${s.married?'老公的約會邀請':'他的邀約'}</h2><div class="chat"><div class="who">陸言 · ${esc(relationship())}</div><div class="line">${esc(invite.text)}</div></div>${already?'<p class="tip">今天已回覆過一則邀約。明天可以再收取新的邀約，現在仍可回顧這則訊息。</p>':''}<div class="btn-row"><button class="btn" data-act="reply-invite" data-id="yes" ${already?'disabled':''}>♡ 好啊，我想去</button><button class="btn secondary" data-act="reply-invite" data-id="later" ${already?'disabled':''}>這次先休息</button></div><p class="tiny" style="margin-top:15px">以上邀約屬於 App 內虛構劇情，不是現實行事曆事件。</p>`)}
function replyInvite(choice){if(!invite||s.lastInvite===today())return;s.lastInvite=today();s.hearts+=choice==='yes'?2:1;let reply=choice==='yes'?'「太好了，我把時間留給妳。妳想去哪裡，我們一起決定。」':'「沒關係。休息也重要，妳有空再約，我一直尊重妳的安排。」';s.messages.unshift({at:new Date().toISOString(),type:'邀約',his:invite.text,mine:choice==='yes'?'好啊，我想去':'這次先休息',reply});s.messages=s.messages.slice(0,60);save();render();modal(`<div class="eyebrow">MESSAGE DELIVERED ♡</div><h2>陸言的回覆</h2><div class="chat"><div class="who">陸言</div><div class="line">${esc(reply)}</div></div><div class="chip">親密值 +${choice==='yes'?2:1}</div><div style="margin-top:20px"><button class="btn" data-act="close-modal">收進心裡 ♡</button></div>`)}
function sweetTalk(){if(stage()===0)return;let arr=s.married?[...lines.married,...lines.early]:stage()>=5?[...lines.date,...lines.early]:lines.early;let idx=(Number(today().replaceAll('-',''))+s.messages.length)%arr.length,fresh=s.lastLoveNote!==today(),oldNote=s.messages.find(m=>m.type==='情話'&&m.at?.slice(0,10)===today()),line=!fresh&&oldNote?oldNote.his:arr[idx];if(fresh){s.lastLoveNote=today();s.hearts+=1;s.messages.unshift({at:new Date().toISOString(),type:'情話',his:line});s.messages=s.messages.slice(0,60);save();render()}modal(`<div class="eyebrow">WHISPER FROM LU YAN</div><h2>只對妳說的情話</h2><div class="chat"><div class="who">♡ 陸言</div><div class="line">${esc(line)}</div></div><p class="muted">${fresh?'今天的心動已收藏，親密值 +1。':'今天的情話已收藏，明天再來會有新的心動。'}</p><button class="btn" data-act="close-modal">♡ 收下這句話</button>`)}
function history(){if(stage()===0)return;modal(`<h2>你們的情話信箱 💌</h2><p class="muted">最近 60 則互動。故事資料只保存在你目前的瀏覽器。</p>${s.messages.length?s.messages.slice(0,25).map(m=>`<div class="chat"><div class="who">${esc(m.type)} · ${new Date(m.at).toLocaleDateString('zh-TW')}</div><div class="line">${esc(m.his||'')}</div>${m.mine?`<p class="tiny">妳：${esc(m.mine)}</p>`:''}${m.reply?`<p class="muted">陸言：${esc(m.reply)}</p>`:''}</div>`).join(''):'<p class="empty">信箱還沒有回憶，去收取一則邀約吧。</p>'}`)}
function proposal(){if(!chapDone(8))return toast('完成第八章後才能回應求婚');storyModal(8)}
function accept(){if(!chapDone(8)||s.married)return;s.married=true;s.hearts+=5;s.messages.unshift({at:new Date().toISOString(),type:'婚禮',his:'「從今天開始，不是誰依附誰，而是我們一起選擇彼此。」'});save();render();modal(`<div class="scene-banner marriage-scene"><span>HAPPILY, AND FREELY, EVER AFTER</span></div><div class="achievement-pop">💍</div><h2 style="text-align:center">婚姻模式解鎖</h2><p style="text-align:center;line-height:2">你完成了 48 堂課，也選擇了一段自己願意的關係。<br>從今以後，陸言每天都會在 App 裡留下新的情話與約會提議。</p><div class="scene-quote">「太太，我最喜歡的婚姻，是我們依然能各自自由，卻每天都想回到彼此身邊。」</div><button class="btn" data-act="go-love">進入我們的日常 ♡</button>`)}
function addHabit(){modal(`<h2>新增養成習慣 🌷</h2><p class="muted">寫下一件你願意持續的小事。</p><div class="field"><label for="new-habit">習慣名稱</label><input class="text-input" id="new-habit" maxlength="35" placeholder="例如：每晚閱讀10分鐘"></div><button class="btn" data-act="save-habit">加入每日打卡</button>`)}
function demo(){return [{id:'bonus-example-01',chapter:8,category:'能力',title:'範例：公共演說',knowledge:'事先整理三個核心觀點，想像聽眾最需要理解的內容，並用短句練習表達。',challenge:'錄下自己一分鐘的演說，聽完後提出一個改進點。',question:'好的簡報開場通常應先？',options:['自我介紹二十分鐘','說明聽眾可以獲得的重點','塞滿所有細節','直接放結尾'],answer:1,explanation:'先建立聽眾對重點的理解。'}]}
function download(name,obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validateLesson(l){return l&&typeof l.id==='string'&&l.id.length<=80&&/^[\w-]+$/.test(l.id)&&Number.isInteger(l.chapter)&&l.chapter>=1&&l.chapter<=8&&['變美','能力'].includes(l.category)&&['title','knowledge','challenge','question','explanation'].every(k=>typeof l[k]==='string'&&l[k].length>0&&l[k].length<=3000)&&Array.isArray(l.options)&&l.options.length===4&&l.options.every(x=>typeof x==='string'&&x.length<=600)&&Number.isInteger(l.answer)&&l.answer>=0&&l.answer<=3}
function reset(){modal(`<h2>確認重新開始？</h2><p>這會清除這台裝置上的通關、打卡、戀愛故事與自訂課程進度。無法復原，除非你已有 JSON 備份。</p><div class="btn-row"><button class="btn" data-act="confirm-reset">確定清除</button><button class="btn secondary" data-act="close-modal">取消</button></div>`)}
function action(a,id){switch(a){case'open-profile':go('profile');break;case'current-chapter':changeChapter(openChapter());break;case'chapter':changeChapter(Number(id));break;case'view-chapter':if(chapDone(Number(id)))storyModal(Number(id));else changeChapter(Number(id));break;case'locked-chapter':toast('前一章還有課程待完成，繼續加油 ♡');break;case'next-chapter':close();changeChapter(Math.min(8,Number(id)+1));break;case'clear-filters':selectedChapter=null;academyFilter='全部';search='';render();break;case'lesson':lessonModal(id);break;case'submit-lesson':submitLesson(id);break;case'story':storyModal(Number(id));break;case'close-modal':case'finish-story':case'defer-proposal':close();break;case'invitation':invModal();break;case'married-date':invModal(true);break;case'reply-invite':replyInvite(id);break;case'sweet-talk':sweetTalk();break;case'messages':history();break;case'proposal':proposal();break;case'accept-proposal':accept();break;case'go-love':close();go('romance');break;case'add-habit':addHabit();break;case'save-habit':{let name=$('#new-habit')?.value.trim();if(!name)return toast('請輸入習慣名稱');if(s.customHabits.length>=25)return toast('最多新增25項自訂習慣');s.customHabits.push({id:'custom-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*10000),name,icon:'✨'});save();close();render();toast('已加入每日習慣');break}case'del-habit':{s.customHabits=s.customHabits.filter(h=>h.id!==id);save();render();toast('已刪除自訂習慣');break}case'save-nickname':{let name=$('#nickname')?.value.trim();if(!name)return toast('請輸入稱呼');s.nickname=name.slice(0,24);save();render();toast('新稱呼已儲存 ♡');break}case'export':download('變美旅途-進度備份-'+today()+'.json',{app:'beauty-journey',version:1,exported:new Date().toISOString(),state:s});toast('進度備份已下載');break;case'import':$('#backup-file').click();break;case'import-lessons':$('#lessons-file').click();break;case'sample-json':download('變美旅途-課程範例.json',demo());break;case'reset':reset();break;case'confirm-reset':s=makeState();selectedChapter=null;academyFilter='全部';search='';save();close();render();toast('新旅程已開始');break;default:break}}
window.addEventListener('click',e=>{let target=e.target.closest('[data-tab],[data-act]');if(!target)return;if(target.dataset.tab){go(target.dataset.tab);return}if(target.dataset.act){e.preventDefault();action(target.dataset.act,target.dataset.id||'')}});
window.addEventListener('change',e=>{let t=e.target;if(t.dataset.habit){s.habitDays[today()]||={};s.habitDays[today()][t.dataset.habit]=t.checked;save();render();if(completedHabits()===dailyHabits().length)toast('今日養成完成，送你一朵玫瑰 🌹')}});
window.addEventListener('input',e=>{if(e.target.id==='lesson-search'){let pos=e.target.selectionStart;search=e.target.value;render();let el=$('#lesson-search');el?.focus();try{el.setSelectionRange(pos,pos)}catch{}}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').classList.contains('hidden'))close()});$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))close()});
$('#backup-file').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{let data=JSON.parse(await file.text());if(data.app!=='beauty-journey'||!data.state||typeof data.state!=='object'||Array.isArray(data.state))throw Error('格式不符：這不是變美旅途備份');if(!Array.isArray(data.state.extraLessons||[]))throw Error('自訂課程格式不符');s={...makeState(),...data.state};s.extraLessons=s.extraLessons.filter(validateLesson).map(l=>({...l,bonus:true}));s.customHabits=Array.isArray(s.customHabits)?s.customHabits:[];s.habitDays=s.habitDays&&typeof s.habitDays==='object'?s.habitDays:{};s.completed=s.completed&&typeof s.completed==='object'?s.completed:{};s.readStories=s.readStories&&typeof s.readStories==='object'?s.readStories:{};s.messages=Array.isArray(s.messages)?s.messages:[];s.tab='profile';save();render();toast('備份匯入成功，旅程已恢復')}catch(err){toast('匯入失敗：'+err.message)}});
$('#lessons-file').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{let data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:Array.isArray(data.lessons)?data.lessons:null;if(!arr)throw Error('需要 JSON 陣列或包含 lessons 陣列的物件');if(arr.length>200)throw Error('一次最多匯入200堂課');let ids=new Set(lessonAll().map(l=>l.id)),newItems=[];for(let l of arr){if(!validateLesson(l))throw Error('課程欄位不正確，請參考範例');if(!ids.has(l.id)){ids.add(l.id);newItems.push({...l,bonus:true})}}s.extraLessons.push(...newItems);save();selectedChapter=null;academyFilter='加碼';go('academy');toast(`已新增 ${newItems.length} 堂加碼課程`)}catch(err){toast('課程匯入失敗：'+err.message)}});
window.addEventListener('storage',e=>{if(e.key===SKEY){s=load();render()}});
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));
render();
})();
</script>
</body>
</html>
